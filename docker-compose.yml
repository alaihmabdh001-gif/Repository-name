version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: karak
      POSTGRES_PASSWORD: karak
      POSTGRES_DB: karak_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://karak:karak@db/karak_chat
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
volumes:
  pgdata: